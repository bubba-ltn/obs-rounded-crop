name: Build
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config RelWithDebInfo

      - name: Install to staging folder
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "${{ github.workspace }}/dist"

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/dist/*" -DestinationPath "$env:GITHUB_WORKSPACE/obs-rounded-crop-windows-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $v = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: obs-rounded-crop-windows-x64
          path: |
            obs-rounded-crop-windows-x64.zip
            out/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-rounded-crop-windows-x64.zip
            out/*.exe
